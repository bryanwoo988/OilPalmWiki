<!-- Applied before first paint, so a dark-mode reader never sees a white flash
     and a returning reader never sees the language picker appear and vanish.
     Onboarding is assumed until storage proves otherwise: if reading it fails,
     showing the picker is the right fallback. -->
<script>
(function () {
  var r = document.documentElement;
  r.dataset.onboarding = 'on';
  try {
    var p = JSON.parse(localStorage.getItem('opwiki.prefs') || '{}');
    if (p.theme) r.dataset.theme = p.theme;
    r.lang = p.lang || 'en';
    if (p.fontScale) r.style.setProperty('--font-scale', p.fontScale);
    if (p.fontScale >= 1.3) r.dataset.wide = 'on';
    if (p.langChosen === true) delete r.dataset.onboarding;
  } catch (e) { /* private mode: defaults, and the picker shows */ }
})();
</script>

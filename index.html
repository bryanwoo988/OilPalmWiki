<!doctype html>
<html lang="zh" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>油棕百科 · OPWiki · Wiki Sawit</title>
<meta name="description" content="Offline trilingual oil palm reference — 油棕百科 / OPWiki / Wiki Sawit">
<meta name="theme-color" content="#FBFAF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OPWiki">

<link rel="stylesheet" href="css/app.css">

<!-- Applied before first paint so a dark-mode user never sees a white flash. -->
<script>
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('opwiki.prefs') || '{}');
    var r = document.documentElement;
    if (p.theme) r.dataset.theme = p.theme;
    if (p.lang) r.lang = p.lang;
    if (p.fontScale) r.style.setProperty('--font-scale', p.fontScale);
    if (p.fontScale >= 1.3) r.dataset.wide = 'on';
  } catch (e) { /* private mode: fall through to defaults */ }
})();
</script>
</head>
<body>

<a class="skip-link" href="#main" data-i18n="skipToContent">跳到正文</a>

<header class="appbar">
  <button class="appbar__brand" id="btn-home" type="button">
    <img class="appbar__mark" src="icons/icon-192.png" alt="" width="28" height="28" decoding="async">
    <span class="appbar__name" id="app-name">油棕百科</span>
  </button>

  <nav class="appbar__tools" aria-label="App controls">
    <button class="iconbtn" id="btn-search" type="button" data-i18n-label="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </button>

    <button class="iconbtn iconbtn--text" id="btn-lang" type="button" data-i18n-label="switchLanguage">
      <span id="lang-glyph">中</span>
    </button>

    <button class="iconbtn iconbtn--text" id="btn-read" type="button" data-i18n-label="readingSize">
      <span id="read-glyph" class="read-glyph">A</span>
    </button>

    <button class="iconbtn" id="btn-theme" type="button" data-i18n-label="theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-auto"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-light"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-dark"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>

    <button class="iconbtn" id="btn-info" type="button" data-i18n-label="about">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.75" r="1.1" fill="currentColor" stroke="none"/></svg>
    </button>
  </nav>
</header>

<main id="main" class="main" tabindex="-1"></main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
